services:
  framac-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: framac-pipeline:latest
    working_dir: /framac-run
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
      # Needed only so bubblewrap can unshare a user namespace for the inner sandbox
      # (scripts/sandbox_exec.py). Remove to keep Docker's default seccomp profile;
      # target-controlled execution then fails closed unless FRAMAC_SANDBOX_DEGRADED=1.
      - seccomp:unconfined
    cpus: 4
    mem_limit: 8g
    pids_limit: 4096
    environment:
      - PYTHONIOENCODING=utf-8
      - OPAMROOT=/opt/opam
      - FRAMAC_OUTER_SANDBOX=docker-hardened
    volumes:
      - ${TARGET_REPO_PATH:?set TARGET_REPO_PATH to the target repository}:/target:ro
      - ${FRAMAC_RUN_DIR:?set FRAMAC_RUN_DIR to a run directory outside the target}:/framac-run
      - ./scripts:/opt/framac-pipeline/scripts:ro
      - ./templates:/opt/framac-pipeline/templates:ro
      - ./schemas:/opt/framac-pipeline/schemas:ro
