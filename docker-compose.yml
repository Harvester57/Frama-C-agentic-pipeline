# Manual use only (e.g. `docker compose run --rm framac-pipeline "<command>"`).
# The wrappers (wrappers/framac-docker.sh / .ps1) do not use this file: they size every container
# dynamically through the host broker (scripts/resources.py exec), which measures the machine on each
# call and sets --cpus/--memory/--pids-limit per job class. The static limits below are only a
# reasonable default for an interactive container; scripts inside still size themselves from the
# container's cgroup limits.
services:
  framac-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: framac-pipeline:latest
    working_dir: /framac-run
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    cpus: 4
    mem_limit: 8g
    pids_limit: 4096
    environment:
      - PYTHONIOENCODING=utf-8
      - OPAMROOT=/home/opam/.opam
      - FRAMAC_OUTER_SANDBOX=docker-hardened
    volumes:
      - ${TARGET_REPO_PATH:?set TARGET_REPO_PATH to the target repository}:/target:ro
      - ${FRAMAC_RUN_DIR:?set FRAMAC_RUN_DIR to a run directory outside the target}:/framac-run
      - ./scripts:/opt/framac-pipeline/scripts:ro
      - ./templates:/opt/framac-pipeline/templates:ro
      - ./schemas:/opt/framac-pipeline/schemas:ro
      - ./skills:/opt/framac-pipeline/skills:ro
      - ./docs/references:/opt/framac-pipeline/docs/references:ro
