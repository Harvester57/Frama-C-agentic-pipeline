name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

# Default to zero permissions at the workflow level; each job grants only what it requires.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: never
          upload-database: false

      - name: Enforce zero CodeQL findings
        run: |
          python3 -c '
          import json, pathlib, sys
          alerts = []
          for sarif_path in sorted(pathlib.Path("sarif-results").glob("*.sarif")):
              data = json.loads(sarif_path.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  for res in run.get("results", []):
                      level = res.get("level", "warning")
                      if level in ("error", "warning"):
                          rule = res.get("ruleId", "unknown")
                          msg = res.get("message", {}).get("text", "")
                          locs = res.get("locations", [])
                          where = ""
                          if locs:
                              phys = locs[0].get("physicalLocation", {})
                              uri = phys.get("artifactLocation", {}).get("uri", "")
                              line = phys.get("region", {}).get("startLine", 0)
                              where = f"{uri}:{line}"
                          alerts.append(f"[{level}] {rule} at {where}: {msg}")
          if alerts:
              print("\n".join(alerts), file=sys.stderr)
              sys.exit(1)
          print("CodeQL check passed with 0 alerts.")
          '

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
