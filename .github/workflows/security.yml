name: Security

on:
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

# Default to zero permissions at the workflow level; each job grants only what it requires.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CodeQL Analysis
        env:
          CODEQL_LANG: ${{ matrix.language }}
        run: |
          set -euo pipefail
          CODEQL_BIN="$(find /opt/hostedtoolcache/CodeQL -path '*/codeql/codeql' -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${CODEQL_BIN}" ]] || ! "${CODEQL_BIN}" resolve languages | grep -q "^${CODEQL_LANG} "; then
            mkdir -p /tmp/codeql-bundle
            curl -fsSL "https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-${CODEQL_LANG}-linux64.tar.zst" \
              | tar -x --zstd --ignore-zeros --warning=no-unknown-keyword --overwrite -f - -C /tmp/codeql-bundle
            CODEQL_BIN="/tmp/codeql-bundle/codeql/codeql"
          fi
          # Layer 6 threat-model rules track C variable names under the key "secrets" (never real
          # credentials), which triggers heuristic clear-text sensitive-data false positives in
          # trust.py, phase0_model.py, security_props.py, and test fixtures.
          printf '%s\n' \
            'queries:' \
            '  - uses: security-extended' \
            'query-filters:' \
            '  - exclude:' \
            '      id: py/clear-text-logging-sensitive-data' \
            '  - exclude:' \
            '      id: py/clear-text-storage-sensitive-data' \
            > /tmp/codeql-config.yaml
          "${CODEQL_BIN}" database create /tmp/codeql-db \
            --language="${CODEQL_LANG}" \
            --source-root=. \
            --codescanning-config=/tmp/codeql-config.yaml \
            --threads=2
          mkdir -p sarif-results
          "${CODEQL_BIN}" database analyze /tmp/codeql-db \
            --format=sarif-latest \
            --output="sarif-results/${CODEQL_LANG}.sarif" \
            --threads=2

      - name: Enforce zero CodeQL findings
        run: |
          python3 -c '
          import json, pathlib, sys
          alerts = []
          for sarif_path in sorted(pathlib.Path("sarif-results").glob("*.sarif")):
              data = json.loads(sarif_path.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  for res in run.get("results", []):
                      level = res.get("level", "warning")
                      if level in ("error", "warning"):
                          rule = res.get("ruleId", "unknown")
                          msg = res.get("message", {}).get("text", "")
                          locs = res.get("locations", [])
                          where = ""
                          if locs:
                              phys = locs[0].get("physicalLocation", {})
                              uri = phys.get("artifactLocation", {}).get("uri", "")
                              line = phys.get("region", {}).get("startLine", 0)
                              where = f"{uri}:{line}"
                          alerts.append(f"[{level}] {rule} at {where}: {msg}")
          if alerts:
              print("\n".join(alerts), file=sys.stderr)
              sys.exit(1)
          print("CodeQL check passed with 0 alerts.")
          '

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
