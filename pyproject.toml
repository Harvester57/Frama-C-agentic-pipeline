[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "acsl_ast",
    "build_callgraph_dag",
    "checkpoint",
    "conftest",
    "contract_negotiator",
    "eacsl_toolchain",
    "fingerprint",
    "framac_common",
    "generate_harness",
    "generate_report",
    "ledger",
    "minischema",
    "promote_artifact",
    "run_eacsl_fuzz",
    "run_eva_slice",
    "run_metadata",
    "run_wp_function",
    "sandbox_exec",
    "validate_artifacts",
    "workspace_overlay",
]

[tool.mypy]
python_version = "3.10"
mypy_path = ["scripts", "tests"]
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
