[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "acsl_ast",
    "api_harness",
    "benchmark",
    "benchmark_briefs",
    "benchmark_compare",
    "benchmark_seeded",
    "build_callgraph_dag",
    "build_capture",
    "c_definitions",
    "cache",
    "checkpoint",
    "codeql_trust",
    "conftest",
    "contract_negotiator",
    "eacsl_toolchain",
    "eva_flamegraph",
    "eva_loops",
    "eva_options",
    "eva_shards",
    "eva_tuning",
    "extract_references",
    "fc_cpp_wrapper",
    "fingerprint",
    "framac_common",
    "frame_skeleton",
    "function_facts",
    "function_slice",
    "fuzz_assets",
    "fuzz_dictionary",
    "generate_harness",
    "generate_report",
    "harness_reach",
    "image_toolchain",
    "kernel_ast",
    "ledger",
    "minischema",
    "module_map",
    "mutation_check",
    "phase0_gates",
    "phase0_model",
    "pipeline_make",
    "promote_artifact",
    "proof_carry",
    "prover_candidates",
    "resources",
    "run_eacsl_fuzz",
    "run_eva_slice",
    "run_metadata",
    "run_wp_function",
    "sandbox_exec",
    "security_props",
    "seed_harvest",
    "spec_kb",
    "target_env",
    "tiers",
    "trust",
    "unit_split",
    "validate_artifacts",
    "workspace_overlay",
    "wp_scheduler",
]

[tool.mypy]
python_version = "3.10"
mypy_path = ["scripts", "tests"]
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true
