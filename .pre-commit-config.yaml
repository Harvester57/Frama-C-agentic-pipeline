repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^(scripts|tests|tools)/
        additional_dependencies:
          - pytest

  - repo: local
    hooks:
      # Control characters, CRLF, mangled ACSL escapes, redefined test constants
      - id: check-generated-text
        name: check generated text
        entry: python tools/check_generated_text.py
        language: system
        files: \.(py|md|sh|c|h)$
      # skills/ is the source of truth; .agents/skills and .claude/skills are plain copies of it.
      # To fix a failure: edit under skills/, then run `python tools/sync_skill_mirrors.py`.
      - id: check-skill-mirrors
        name: check skill mirrors
        entry: python tools/sync_skill_mirrors.py --check
        language: system
        pass_filenames: false
        files: ^(skills|\.agents/skills|\.claude/skills)/
